<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aethelgard Atlas</title>
<style>
:root{color-scheme:dark;--bg:#10151b;--panel:#19212a;--line:#35414d;--text:#e5eaf0;--muted:#9ba8b5;--gold:#c8a45e;--blue:#7ba8d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}header{display:flex;gap:16px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:#151c23}header strong{letter-spacing:.12em;color:var(--gold)}header span{color:var(--muted)}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:calc(100vh - 55px)}#map{position:relative;overflow:hidden;background:#202b31;cursor:crosshair}svg{width:100%;height:100%;display:block}.side{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:16px}.side h2{font-size:15px;margin:0 0 12px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:#10171d;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:8px;font:inherit}.field textarea{min-height:80px;resize:vertical}.btns{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.btn{background:#293541;color:var(--text);border:1px solid #43515e;border-radius:5px;padding:8px 10px;cursor:pointer}.btn:hover{border-color:var(--gold)}.primary{background:#65502c;border-color:var(--gold)}#territories{display:grid;gap:5px;margin:8px 0 18px}.item{padding:8px;border:1px solid var(--line);border-radius:5px;cursor:pointer}.item.active{border-color:var(--gold);background:#2b2a25}.item small{display:block;color:var(--muted)}.hint{color:var(--muted);font-size:12px}.legend{position:absolute;bottom:12px;left:12px;background:#111bdf12;background:#111bdf; background:rgba(15,22,28,.9);border:1px solid var(--line);padding:8px 11px;border-radius:5px;color:var(--muted);font-size:12px;pointer-events:none}#status{color:var(--gold);min-height:18px;font-size:12px}.city{cursor:pointer}.city circle{fill:#f1d99d;stroke:#1b2228;stroke-width:2}.city text{fill:#f3eee2;font-size:12px;paint-order:stroke;stroke:#1b2228;stroke-width:3px;stroke-linejoin:round}@media(max-width:800px){main{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 55px)}#map{height:58vh}.side{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><strong>AETHELGARD ATLAS</strong><span>Worldbuilding GIS · prototype 0.1</span></header>
<main><section id="map"><svg id="svg" viewBox="0 0 1000 720" role="img" aria-label="Schematic political map">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7f9690" stroke-opacity=".15"/></pattern><linearGradient id="land" x2="0" y2="1"><stop stop-color="#52675f"/><stop offset="1" stop-color="#334840"/></linearGradient></defs><rect width="1000" height="720" fill="#202e37"/><rect width="1000" height="720" fill="url(#grid)"/><path d="M0 0H700L655 70 690 130 610 180 650 240 590 300 650 360 600 430 655 500 600 580 630 720H0Z" fill="url(#land)" opacity=".8"/><path d="M180 0L220 100 190 180 250 260 230 340 290 420 260 500 320 600 300 720M480 0L450 100 500 180 460 260 510 350 470 430 520 510 500 600 540 720M0 240L170 220 300 250 450 220 600 260 780 220M0 500L180 460 300 490 470 450 650 500" fill="none" stroke="#a8b6a1" stroke-opacity=".18" stroke-width="14"/><g id="polys"></g><g id="cities"></g><g id="drawLayer"></g></svg><div class="legend">СХЕМА, НЕ ТОЧНАЯ ГЕОГРАФИЯ · выбери территорию или включи «Новая граница»</div></section>
<aside class="side"><h2>Территории</h2><div id="territories"></div><div class="btns"><button class="btn primary" id="new">+ Новая граница</button><button class="btn" id="finish">Завершить</button><button class="btn" id="cancel">Отмена</button></div><div id="status"></div><h2>Свойства объекта</h2><div class="field"><label>Название</label><input id="name"></div><div class="field"><label>Тип политического образования</label><select id="type"><option>Корпоративная территория</option><option>Конфедерация</option><option>Республика</option><option>Монархия</option><option>Союз коммун</option><option>Провинция</option><option>Другое</option></select></div><div class="field"><label>Столица</label><input id="capital"></div><div class="field"><label>Статус канона</label><select id="canon"><option>Канон</option><option>Предложение</option><option>Черновик</option></select></div><div class="field"><label>Цвет</label><input id="color" type="color" value="#c8a45e"></div><div class="field"><label>Заметки / лор</label><textarea id="notes"></textarea></div><div class="btns"><button class="btn primary" id="save">Сохранить свойства</button><button class="btn" id="delete">Удалить территорию</button></div><h2>Проект</h2><div class="btns"><button class="btn" id="export">Экспорт JSON</button><button class="btn" id="import">Импорт JSON</button><button class="btn" id="reset">Сбросить демо</button><input id="file" type="file" accept=".json,application/json" hidden></div><p class="hint">Автосохранение в этом браузере. Экспортируй JSON как резервную копию. Начальные границы условны и не являются утверждённым каноном.</p></aside></main>
<script>
const seed=[
{id:'aethelgard',name:'Aethelgard Corporate Territory',type:'Корпоративная территория',capital:'Highland Keep',canon:'Канон',color:'#c8a45e',notes:'Корпоративное ядро на высоком плато над долинами. География и границы требуют уточнения.',points:[[330,300],[420,270],[490,300],[510,360],[470,410],[390,400],[350,360]]},
{id:'alpine',name:'Alpine Confederation',type:'Конфедерация',capital:'Edelberg (временно)',canon:'Предложение',color:'#6c9aaf',notes:'Столица в Восточной дуге; название Edelberg предварительное.',points:[[470,410],[510,360],[570,380],[620,430],[600,490],[520,510],[470,470]]},
{id:'communes',name:'Free Communes League',type:'Союз коммун',capital:'Не определена',canon:'Предложение',color:'#76a47b',notes:'Западный сосед — предварительная концепция.',points:[[220,280],[330,300],[350,360],[390,400],[330,450],[250,420],[200,350]]},
{id:'rhine',name:'Rhine Defense Alliance',type:'Другое',capital:'Не определена',canon:'Предложение',color:'#7f8fbd',notes:'Северо-западный сосед — предварительная концепция.',points:[[180,170],[300,160],[370,220],[330,300],[220,280],[160,230]]},
{id:'east',name:'Eastern Duchy',type:'Монархия',capital:'Не определена',canon:'Предложение',color:'#b77f7f',notes:'Восточный сосед — предварительная концепция.',points:[[490,300],[560,250],[680,280],[700,360],[620,430],[570,380],[510,360]]},
{id:'south',name:'Southern Marches',type:'Другое',capital:'Не определена',canon:'Предложение',color:'#ad9167',notes:'Южные территории — предварительная концепция.',points:[[330,450],[390,400],[470,470],[520,510],[500,590],[390,600],[300,540],[250,420]]}
];
const seedCities=[{name:'Highland Keep',x:420,y:345},{name:'Edelberg',x:550,y:445},{name:'Vaduz',x:395,y:365},{name:'Bregenz',x:365,y:340},{name:'Schaan',x:402,y:378},{name:'Buchs',x:430,y:380},{name:'Innsbruck',x:600,y:450}];
let data=load(),selected=data.territories[0]?.id||null,drawing=false,draft=[];
const $=id=>document.getElementById(id),svg=$('svg'),NS='http://www.w3.org/2000/svg';
function load(){try{return JSON.parse(localStorage.getItem('aethelgard-atlas'))||{territories:structuredClone(seed),cities:structuredClone(seedCities)}}catch{return {territories:structuredClone(seed),cities:structuredClone(seedCities)}}}
function persist(){localStorage.setItem('aethelgard-atlas',JSON.stringify(data))}
function node(tag,attrs={}){let n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
function render(){const pg=$('polys'),cg=$('cities');pg.replaceChildren();cg.replaceChildren();for(const t of data.territories){const p=node('polygon',{points:t.points.map(p=>p.join(',')).join(' '),fill:t.color,'fill-opacity':t.id===selected?.48:.28,stroke:t.id===selected?'#f4d48c':t.color,'stroke-width':t.id===selected?4:2});p.style.cursor='pointer';p.onclick=()=>select(t.id);pg.append(p);const c=node('text',{x:t.points.reduce((s,p)=>s+p[0],0)/t.points.length,y:t.points.reduce((s,p)=>s+p[1],0)/t.points.length,'text-anchor':'middle',fill:'#f1f0e8','font-size':14,'font-weight':600,'paint-order':'stroke',stroke:'#1a252b','stroke-width':3});c.textContent=t.name;c.style.pointerEvents='none';pg.append(c)}for(const city of data.cities){const g=node('g',{class:'city'}),dot=node('circle',{cx:city.x,cy:city.y,r:4});const tx=node('text',{x:city.x+8,y:city.y-8});tx.textContent=city.name;g.append(dot,tx);cg.append(g)}$('territories').replaceChildren();for(const t of data.territories){const d=document.createElement('div');d.className='item'+(t.id===selected?' active':'');d.innerHTML='<b></b><small></small>';d.querySelector('b').textContent=t.name;d.querySelector('small').textContent=t.canon+' · '+t.type;d.onclick=()=>select(t.id);$('territories').append(d)}drawDraft()}
function select(id){selected=id;const t=data.territories.find(t=>t.id===id);if(!t)return;for(const k of ['name','type','capital','canon','color','notes'])$(k).value=t[k]||'';render()}
function saveProps(){const t=data.territories.find(t=>t.id===selected);if(!t)return;for(const k of ['name','type','capital','canon','color','notes'])t[k]=$(k).value;persist();render();status('Свойства сохранены')}
function status(s){$('status').textContent=s}
function drawDraft(){const l=$('drawLayer');l.replaceChildren();if(!draft.length)return;const pl=node('polyline',{points:draft.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#f3d58b','stroke-width':3,'stroke-dasharray':'7 5'});l.append(pl);for(const [x,y] of draft)l.append(node('circle',{cx:x,cy:y,r:5,fill:'#fff0bc',stroke:'#222','stroke-width':2}))}
function point(e){const r=svg.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*1000),Math.round((e.clientY-r.top)/r.height*720)]}
svg.addEventListener('click',e=>{if(!drawing)return;draft.push(point(e));drawDraft()});
$('new').onclick=()=>{drawing=true;draft=[];status('Кликай по карте, чтобы поставить точки границы')};
$('finish').onclick=()=>{if(draft.length<3){status('Нужно минимум 3 точки');return}const id='territory-'+Date.now();data.territories.push({id,name:'Новая территория',type:'Другое',capital:'Не определена',canon:'Черновик',color:'#7ba8d8',notes:'',points:draft});drawing=false;draft=[];selected=id;persist();render();select(id);status('Граница создана — отредактируй свойства')};
$('cancel').onclick=()=>{drawing=false;draft=[];drawDraft();status('Рисование отменено')};
$('save').onclick=saveProps;
$('delete').onclick=()=>{if(!selected)return;data.territories=data.territories.filter(t=>t.id!==selected);selected=data.territories[0]?.id||null;persist();render();if(selected)select(selected);status('Территория удалена')};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aethelgard-atlas.json';a.click();URL.revokeObjectURL(a.href);status('JSON экспортирован')};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.territories))throw Error();selected=data.territories[0]?.id||null;persist();render();if(selected)select(selected);status('Проект импортирован')}catch{status('Ошибка: файл не похож на проект Atlas')}};
$('reset').onclick=()=>{if(confirm('Сбросить все изменения и вернуть демо-данные?')){data={territories:structuredClone(seed),cities:structuredClone(seedCities)};selected=data.territories[0].id;persist();render();select(selected);status('Демо восстановлено')}};
render();if(selected)select(selected);
</script></body></html>
