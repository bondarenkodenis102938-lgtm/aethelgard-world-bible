name: Deploy Aethelgard Atlas

on:
  push:
    branches: [main]
    paths:
      - 'tools/aethelgard-atlas/**'
      - '.github/workflows/deploy-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Atlas site
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools/aethelgard-atlas

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
